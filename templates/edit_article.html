{% extends "base.html" %}

{% block title %}Edit Article - Chronicles of History{% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">✏️ Edit Chronicle</h2>
    <p class="form-subtitle">Revise your historical narrative</p>
    
    <form method="POST" class="article-form">
        <div class="form-group">
            <label for="title" class="form-label">Title of Your Chronicle</label>
            <input type="text" id="title" name="title" class="form-input" value="{{ article.title }}" required>
        </div>
        
        <div class="form-group">
            <label for="author" class="form-label">Your Name (Author)</label>
            <input type="text" id="author" name="author" class="form-input" value="{{ article.author }}" required>
        </div>
        
        <div class="form-group">
            <label for="content" class="form-label">Your Historical Tale</label>
            <textarea id="content" name="content" class="form-textarea" rows="15" required>{{ article.content }}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="{{ url_for('article', article_id=article.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
