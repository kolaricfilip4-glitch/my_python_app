{% extends "base.html" %}

{% block title %}Write New Article - Chronicles of History{% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">📜 Write a New Chronicle</h2>
    <p class="form-subtitle">Share your knowledge of history with the realm</p>
    
    <form method="POST" class="article-form">
        <div class="form-group">
            <label for="title" class="form-label">Title of Your Chronicle</label>
            <input type="text" id="title" name="title" class="form-input" placeholder="The Battle of Hastings: A Turning Point" required>
        </div>
        
        <div class="form-group">
            <label for="author" class="form-label">Your Name (Author)</label>
            <input type="text" id="author" name="author" class="form-input" placeholder="Sir Geoffrey the Chronicler" required>
        </div>
        
        <div class="form-group">
            <label for="content" class="form-label">Your Historical Tale</label>
            <textarea id="content" name="content" class="form-textarea" rows="15" placeholder="In the year 1066, a great battle was fought that would change the course of English history..." required></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">🏛️ Publish Chronicle</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
